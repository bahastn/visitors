<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title th:text="${visitor.fullName}">Visitor</title></head>
<body>
<section>
    <div class="crumb"><a th:href="@{/visitors}" th:text="#{nav.visitors}"></a></div>
    <div th:if="${!#lists.isEmpty(watchHits)}" class="alert alert-danger">
        <i class="bi bi-shield-exclamation"></i> <strong th:text="#{watch.hitTitle}"></strong>
        <ul class="mb-0"><li th:each="w : ${watchHits}"><b th:text="${@labels.t(w.level)}"></b>: <span th:text="${w.reason}"></span></li></ul>
    </div>

    <div class="req-head">
        <div class="d-flex flex-wrap justify-content-between gap-3 align-items-center">
            <div class="person">
                <img th:if="${visitor.photoPath}" th:src="@{/visitors/{id}/photo(id=${visitor.id})}" class="person-photo lg" alt="">
                <span th:unless="${visitor.photoPath}" class="person-photo lg"><i class="bi bi-person"></i></span>
                <div>
                    <h1 class="mb-1"><span th:text="${visitor.fullName}"></span> <span th:if="${visitor.vip}" class="tag danger" th:text="#{common.vip}"></span></h1>
                    <div class="req-meta">
                        <span th:if="${visitor.nameLatin}" class="ltr" th:text="${visitor.nameLatin}"></span>
                        <span th:if="${visitor.jobTitle}"><i class="bi bi-briefcase"></i> <span th:text="${visitor.jobTitle}"></span></span>
                        <span th:if="${visitor.organization}"><i class="bi bi-building"></i> <span th:text="${visitor.organization}"></span></span>
                        <span><i class="bi bi-telephone"></i> <a class="ltr" th:href="'tel:' + ${visitor.phone}" th:text="${visitor.phone}"></a></span>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2" sec:authorize="hasAnyRole('ADMIN','DIRECTOR','SECRETARY','RECEPTION','HEAD')">
                <a th:href="@{/visitors/{id}/edit(id=${visitor.id})}" class="btn btn-light"><i class="bi bi-pencil"></i> <span th:text="#{common.edit}"></span></a>
                <a th:href="@{/requests/new(visitorId=${visitor.id})}" class="btn btn-accent"><i class="bi bi-plus-lg"></i> <span th:text="#{visitor.newVisit}"></span></a>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="panel">
                <div class="panel-head"><h2 th:text="#{visitor.profile}"></h2></div>
                <div class="panel-body">
                    <dl class="kv">
                        <th:block th:if="${visitor.phoneSecondary}"><dt th:text="#{visitor.phone2}"></dt><dd class="ltr" th:text="${visitor.phoneSecondary}"></dd></th:block>
                        <th:block th:if="${visitor.whatsappNumber}"><dt th:text="#{visitor.whatsapp}"></dt><dd class="ltr" th:text="${visitor.whatsappNumber}"></dd></th:block>
                        <dt th:text="#{visitor.email}"></dt><dd><a th:if="${visitor.email}" th:href="'mailto:' + ${visitor.email}" th:text="${visitor.email}"></a><span th:unless="${visitor.email}">—</span></dd>
                        <dt th:text="#{visitor.contactChannel}"></dt><dd th:text="${@labels.t(visitor.preferredContactChannel)}"></dd>
                        <dt th:text="#{visitor.language}"></dt><dd th:text="${@labels.t(visitor.preferredLanguage)}"></dd>
                        <dt th:text="#{visitor.consent}"></dt><dd th:text="${visitor.consentToMessages} ? #{common.yes} : #{common.no}"></dd>
                        <dt th:text="#{visitor.gender}"></dt><dd th:text="${@labels.t(visitor.gender) ?: '—'}"></dd>
                        <dt th:text="#{visitor.dob}"></dt><dd><span class="ltr" th:text="${@dates.date(visitor.dateOfBirth)}"></span> <span class="small-muted" th:if="${visitor.age}" th:text="#{visitor.ageYears(${visitor.age})}"></span></dd>
                        <dt th:text="#{visitor.nationality}"></dt><dd th:text="${visitor.nationality}"></dd>
                        <dt th:text="#{visitor.idType}"></dt><dd th:text="${@labels.t(visitor.idType)}"></dd>
                        <dt th:text="#{visitor.idNumber}"></dt><dd class="ltr" th:text="${visitor.maskedIdNumber}"></dd>
                        <th:block th:if="${visitor.idExpiryDate}"><dt th:text="#{visitor.idExpiry}"></dt><dd class="ltr" th:classappend="${visitor.idExpiryDate.isBefore(@dates.today())} ? 'text-danger fw-bold'" th:text="${@dates.date(visitor.idExpiryDate)}"></dd></th:block>
                        <dt th:text="#{visitor.orgType}"></dt><dd th:text="${@labels.t(visitor.organizationType)}"></dd>
                        <dt th:text="#{visitor.governorate}"></dt><dd><span th:text="${@labels.t(visitor.governorate)}"></span> <span th:text="${visitor.city}"></span> <span th:text="${visitor.district}"></span></dd>
                        <dt th:text="#{visitor.address}"></dt><dd th:text="${visitor.address ?: '—'}"></dd>
                        <th:block th:if="${visitor.emergencyContactName}"><dt th:text="#{visitor.emergencyName}"></dt><dd><span th:text="${visitor.emergencyContactName}"></span> <span class="ltr" th:text="${visitor.emergencyContactPhone}"></span></dd></th:block>
                        <dt th:text="#{common.createdBy}"></dt><dd><span th:text="${visitor.createdBy?.fullName ?: #messages.msg('common.publicForm')}"></span> <span class="small-muted ltr" th:text="${@dates.date(visitor.createdAt)}"></span></dd>
                    </dl>
                    <div th:if="${visitor.notes}" class="mt-3 p-2 rounded small" style="background:var(--canvas)" th:text="${visitor.notes}"></div>
                </div>
                <div class="panel-foot" sec:authorize="hasAnyRole('ADMIN','DIRECTOR','SECRETARY','RECEPTION','SECURITY','HEAD')">
                    <form th:action="@{/visitors/{id}/photo(id=${visitor.id})}" method="post" enctype="multipart/form-data" class="d-flex gap-2">
                        <input type="file" name="file" accept="image/*" capture="user" class="form-control form-control-sm" required th:attr="aria-label=#{visitor.photo}">
                        <button class="btn btn-light btn-sm text-nowrap"><i class="bi bi-camera"></i> <span th:text="#{visitor.uploadPhoto}"></span></button>
                    </form>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head"><h2 th:text="#{nav.cases}"></h2></div>
                <ul class="list" th:if="${!#lists.isEmpty(cases)}">
                    <li th:each="c : ${cases}"><div class="grow"><a class="row-title" th:href="@{/cases/{id}(id=${c.id})}" th:text="${c.title}"></a>
                        <div class="row-sub ltr" th:text="${c.caseNumber}"></div></div><span class="tag" th:text="${@labels.t(c.status)}"></span></li>
                </ul>
                <div class="panel-foot">
                    <form th:action="@{/cases}" method="post" class="d-flex gap-2">
                        <input type="hidden" name="visitorId" th:value="${visitor.id}">
                        <input class="form-control form-control-sm" name="title" required th:placeholder="#{case.newTitle}" th:attr="aria-label=#{case.newTitle}">
                        <button class="btn btn-light btn-sm text-nowrap"><i class="bi bi-folder-plus"></i> <span th:text="#{case.new}"></span></button>
                    </form>
                </div>
            </div>

            <div th:if="${!#lists.isEmpty(duplicates)}" class="panel">
                <div class="panel-head"><h2 th:text="#{visitor.duplicates}"></h2></div>
                <ul class="list"><li th:each="d : ${duplicates}"><a th:href="@{/visitors/{id}(id=${d.id})}" th:text="${d.fullName}"></a> <span class="small-muted ltr" th:text="${d.phone}"></span></li></ul>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="panel">
                <div class="panel-head"><h2 th:text="#{visitor.history}"></h2><span class="small-muted" th:text="${#lists.size(history)}"></span></div>
                <div class="table-responsive" th:if="${!#lists.isEmpty(history)}">
                    <table class="table table-hover">
                        <tbody>
                        <tr th:each="r : ${history}" th:data-href="@{/requests/{id}(id=${r.id})}">
                            <td><div class="row-title" th:text="${r.subject}"></div><div class="row-sub"><span th:text="${@labels.t(r.purpose)}"></span> · <span class="ltr" th:text="${r.referenceNumber}"></span></div></td>
                            <td><span th:replace="~{fragments :: office(${r.office})}"></span></td>
                            <td class="small text-nowrap ltr" th:text="${r.scheduledStart != null} ? ${@dates.dt(r.scheduledStart)} : ${@dates.date(r.createdAt)}"></td>
                            <td><span th:replace="~{fragments :: status(${r.status})}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${#lists.isEmpty(history)}" class="panel-empty" th:text="#{visitor.noVisits}"></div>
            </div>

            <div class="panel">
                <div class="panel-head"><h2 th:text="#{visitor.timeline}"></h2></div>
                <div class="panel-body">
                    <ul class="timeline">
                        <li th:each="a : ${timeline}" class="timeline-item">
                            <span class="timeline-dot" th:classappend="${a.toStatus != null} ? ${'d-' + a.toStatus.name()} : ''"></span>
                            <div class="timeline-title"><span th:text="${#messages.msgOrNull('audit.' + a.action) ?: a.action}"></span>
                                <a th:if="${a.entityType == 'VisitRequest' and refs[a.entityId] != null}" class="small ms-1 ltr" th:href="@{/requests/{id}(id=${a.entityId})}" th:text="${refs[a.entityId]}"></a></div>
                            <div class="timeline-detail" th:if="${a.details}" th:text="${@labels.details(a.details)}"></div>
                            <div class="timeline-meta"><span th:text="${a.actorName}"></span> · <span class="ltr" th:text="${@dates.dt(a.timestamp)}"></span></div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
