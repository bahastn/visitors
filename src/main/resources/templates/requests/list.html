<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title th:text="#{nav.requests}">Requests</title></head>
<body>
<section>
    <div class="page-head">
        <div><h1 th:text="#{nav.requests}"></h1><div class="sub" th:text="#{req.listSub(${'' + page.totalElements})}"></div></div>
        <div class="actions"><a sec:authorize="hasAnyRole('ADMIN','DIRECTOR','SECRETARY','RECEPTION','HEAD')" th:href="@{/requests/new}" class="btn btn-accent"><i class="bi bi-plus-lg"></i> <span th:text="#{nav.newRequest}"></span></a></div>
    </div>
    <div class="panel">
        <form class="filter-bar" method="get">
            <input class="form-control grow" name="q" th:value="${f_q}" th:placeholder="#{req.searchHint}" th:attr="aria-label=#{common.search}">
            <select class="form-select" name="status" th:attr="aria-label=#{req.status}"><option value="" th:text="#{filter.anyStatus}"></option>
                <option th:each="e : ${@labels.values('VisitStatus')}" th:value="${e}" th:text="${@labels.t(e)}" th:selected="${f_status == e}"></option></select>
            <select class="form-select" name="priority" th:attr="aria-label=#{req.priority}"><option value="" th:text="#{filter.anyPriority}"></option>
                <option th:each="e : ${@labels.values('Priority')}" th:value="${e}" th:text="${@labels.t(e)}" th:selected="${f_priority == e}"></option></select>
            <select class="form-select" name="purpose" th:attr="aria-label=#{req.purpose}"><option value="" th:text="#{filter.anyPurpose}"></option>
                <option th:each="e : ${@labels.values('VisitPurpose')}" th:value="${e}" th:text="${@labels.t(e)}" th:selected="${f_purpose == e}"></option></select>
            <select class="form-select" name="channel" th:attr="aria-label=#{req.channel}"><option value="" th:text="#{filter.anyChannel}"></option>
                <option th:each="e : ${@labels.values('RequestChannel')}" th:value="${e}" th:text="${@labels.t(e)}" th:selected="${f_channel == e}"></option></select>
            <select class="form-select" name="managedBy" th:attr="aria-label=#{req.managedBy}"><option value="" th:text="#{filter.anyManager}"></option>
                <option th:each="u : ${staff}" th:value="${u.id}" th:text="${u.fullName}" th:selected="${f_managedBy == u.id}"></option></select>
            <input type="date" class="form-control" name="from" th:value="${f_from}" th:attr="aria-label=#{common.from}">
            <input type="date" class="form-control" name="to" th:value="${f_to}" th:attr="aria-label=#{common.to}">
            <button class="btn btn-primary"><i class="bi bi-funnel"></i> <span th:text="#{common.filter}"></span></button>
            <a th:href="@{/requests}" class="btn btn-ghost" th:text="#{common.reset}"></a>
        </form>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr>
                    <th th:text="#{req.visitorAndSubject}"></th><th th:if="${currentOffice == null}" th:text="#{office.office}"></th>
                    <th th:text="#{req.status}"></th><th th:text="#{req.managedBy}"></th><th th:text="#{req.created}"></th><th th:text="#{req.scheduled}"></th>
                </tr></thead>
                <tbody>
                <tr th:each="r : ${page.content}" th:data-href="@{/requests/{id}(id=${r.id})}">
                    <td><div class="d-flex gap-1 align-items-center flex-nowrap"><span class="row-title truncate" th:text="${r.visitor.fullName}"></span><span th:replace="~{fragments :: flags(${r})}"></span></div>
                        <div class="row-sub truncate"><span class="ltr" th:text="${r.referenceNumber}"></span> · <span th:text="${r.subject}"></span></div></td>
                    <td th:if="${currentOffice == null}"><span th:replace="~{fragments :: office(${r.office})}"></span></td>
                    <td><span th:replace="~{fragments :: status(${r.status})}"></span></td>
                    <td th:text="${r.managedBy?.fullName}"></td>
                    <td><span class="ltr text-nowrap" th:text="${@dates.dt(r.createdAt)}"></span></td>
                    <td><span class="ltr text-nowrap" th:text="${@dates.dt(r.scheduledStart)}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${page.empty}" class="panel-empty"><i class="bi bi-search"></i><span th:text="#{common.noResults}"></span></div>
    </div>
    <nav th:replace="~{fragments :: pager(${page}, ${'/requests?' + queryNoPage})}"></nav>
</section>
</body>
</html>
