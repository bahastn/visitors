<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:dir="${rtl} ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#001d3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="_csrf" th:content="${_csrf?.token}"><meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="apple-touch-icon" th:href="@{/img/logo-192.png}">
    <title th:text="#{nav.mobile}">Mobile</title>
    <link rel="stylesheet" th:href="${rtl} ? @{/vendor/bootstrap/bootstrap.rtl.min.css} : @{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</head>
<body data-refresh="90" th:with="canDecide=${@currentUser.canDecide()}">
<div class="public-top px-3 py-3 d-flex justify-content-between align-items-center sticky-top">
    <div><div class="fw-bold" th:text="${me.fullName}"></div>
        <small style="color:#a9bdd1" th:text="${currentOffice != null} ? ${currentOffice.name} : #{scope.allOffices}"></small></div>
    <a th:href="@{/}" class="btn btn-sm btn-light" th:attr="aria-label=#{nav.dashboard}"><i class="bi bi-grid-1x2"></i></a>
</div>
<div class="container py-3" style="max-width:640px">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="segmented w-100 mb-3" role="tablist">
        <button class="flex-fill active" data-bs-toggle="pill" data-bs-target="#tPending"><span th:text="#{mobile.decide}"></span> <b th:text="${#lists.size(pending)}"></b></button>
        <button class="flex-fill" data-bs-toggle="pill" data-bs-target="#tAgenda"><span th:text="#{mobile.today}"></span> <b th:text="${#lists.size(agenda)}"></b></button>
        <button class="flex-fill" data-bs-toggle="pill" data-bs-target="#tLobby"><span th:text="#{dash.inLobby}"></span> <b th:text="${#lists.size(lobby)}"></b></button>
    </div>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tPending">
            <div th:each="r : ${pending}" class="panel mobile-card mb-2" th:classappend="${'pr-' + r.priority}">
                <div class="panel-body">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span th:replace="~{fragments :: flags(${r})}"></span>
                        <small class="small-muted" th:text="#{common.nDays(${r.daysWaiting})}"></small>
                    </div>
                    <div class="row-title fs-6" th:text="${r.visitor.fullName}"></div>
                    <div class="row-sub" th:text="${r.visitor.organization}"></div>
                    <div class="mt-2" th:text="${r.subject}"></div>
                    <div class="row-sub"><span th:text="${@labels.t(r.purpose)}"></span> · <span th:text="${r.office.name}"></span></div>
                    <div th:if="${r.recommendation}" class="small mt-2 p-2 rounded" style="background:var(--canvas)"><i class="bi bi-hand-thumbs-up"></i>
                        <b th:text="${@labels.t(r.recommendation)}"></b> — <span th:text="${r.recommendedBy?.fullName}"></span>
                        <div th:text="${r.recommendationNote}"></div></div>
                    <div class="d-flex gap-2 mt-3" th:if="${canDecide}">
                        <form th:action="@{/requests/{id}/approve(id=${r.id})}" method="post" class="flex-fill"><input type="hidden" name="back" value="/m">
                            <button class="btn btn-primary w-100"><i class="bi bi-check-lg"></i> <span th:text="#{action.approve}"></span></button></form>
                        <button class="btn btn-outline-danger flex-fill" type="button" data-bs-toggle="collapse" th:data-bs-target="${'#rej' + r.id}"><i class="bi bi-x-lg"></i> <span th:text="#{action.reject}"></span></button>
                    </div>
                    <form th:id="${'rej' + r.id}" class="collapse mt-2" th:action="@{/requests/{id}/reject(id=${r.id})}" method="post">
                        <input type="hidden" name="back" value="/m">
                        <input name="reason" class="form-control mb-2" required th:placeholder="#{req.rejectReason}" th:attr="aria-label=#{req.rejectReason}">
                        <button class="btn btn-danger w-100" th:text="#{action.reject}"></button></form>
                    <a class="small d-block mt-2" th:href="@{/requests/{id}(id=${r.id})}" th:text="#{common.details}"></a>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(pending)}" class="panel panel-empty"><i class="bi bi-check2-all"></i><span th:text="#{wait.empty}"></span></div>
        </div>
        <div class="tab-pane fade" id="tAgenda">
            <div class="panel">
                <ul class="list">
                    <li th:each="r : ${agenda}"><b class="ltr" th:text="${@dates.time(r.scheduledStart)}"></b>
                        <div class="grow"><a class="row-title" th:href="@{/requests/{id}(id=${r.id})}" th:text="${r.visitor.shortName}"></a><div class="row-sub truncate" th:text="${r.subject}"></div></div>
                        <span th:replace="~{fragments :: status(${r.status})}"></span></li>
                </ul>
                <div th:if="${#lists.isEmpty(agenda)}" class="panel-empty" th:text="#{dash.noAgenda}"></div>
            </div>
        </div>
        <div class="tab-pane fade" id="tLobby">
            <div class="panel">
                <ul class="list">
                    <li th:each="r : ${lobby}"><span class="queue-number" style="font-size:1.4rem" th:text="${r.queueNumber}"></span>
                        <div class="grow"><div class="row-title" th:text="${r.visitor.shortName}"></div><div class="row-sub" th:text="${@dates.minutes(r.lobbyWaitMinutes)}"></div></div>
                        <form th:action="@{/requests/{id}/call(id=${r.id})}" method="post"><input type="hidden" name="back" value="/m">
                            <button class="btn btn-accent btn-sm" th:text="#{action.callIn}"></button></form></li>
                </ul>
                <div th:if="${#lists.isEmpty(lobby)}" class="panel-empty" th:text="#{dash.lobbyEmpty}"></div>
            </div>
        </div>
    </div>
    <p class="text-center small-muted mt-4" th:text="#{mobile.installHint}"></p>
</div>
</body>
</html>
