<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title th:text="#{nav.messageLog}">Messages</title></head>
<body>
<section>
    <div class="page-head">
        <div><h1 th:text="#{nav.messageLog}"></h1><div class="sub" th:text="#{notif.logSub}"></div></div>
        <div class="d-flex gap-2 flex-wrap">
            <span class="tag" th:classappend="${smsConfigured} ? info : ''"><i class="bi bi-chat-text"></i> <span th:text="#{enum.NotificationChannel.SMS}"></span>: <span th:text="${smsConfigured} ? #{notif.connected} : #{notif.logOnly}"></span></span>
            <span class="tag" th:classappend="${whatsappConfigured} ? info : ''"><i class="bi bi-whatsapp"></i> <span th:text="#{enum.NotificationChannel.WHATSAPP}"></span>: <span th:text="${whatsappConfigured} ? #{notif.connected} : #{notif.logOnly}"></span></span>
            <span class="tag" th:classappend="${emailConfigured} ? info : ''"><i class="bi bi-envelope"></i> <span th:text="#{enum.NotificationChannel.EMAIL}"></span>: <span th:text="${emailConfigured} ? #{notif.connected} : #{notif.logOnly}"></span></span>
        </div>
    </div>
    <div class="panel">
        <div class="table-responsive">
            <table class="table">
                <thead><tr><th th:text="#{common.time}"></th><th th:text="#{notif.channel}"></th><th th:text="#{notif.to}"></th><th th:text="#{notif.message}"></th><th th:text="#{req.reference}"></th><th th:text="#{req.status}"></th><th></th></tr></thead>
                <tbody>
                <tr th:each="n : ${page.content}">
                    <td class="small text-nowrap ltr" th:text="${@dates.dt(n.createdAt)}"></td>
                    <td class="small" th:text="${@labels.t(n.channel)}"></td>
                    <td class="small ltr" th:text="${n.recipientAddress}"></td>
                    <td class="small" style="max-width:420px"><div class="truncate" th:title="${n.body}" th:text="${n.body}"></div>
                        <div th:if="${n.error}" class="text-danger truncate" th:title="${n.error}" th:text="${n.error}"></div></td>
                    <td class="small"><a th:if="${n.request}" th:href="@{/requests/{id}(id=${n.request.id})}" class="ltr" th:text="${n.request.referenceNumber}"></a></td>
                    <td><span class="tag" th:classappend="${n.status.name() == 'SENT'} ? info : (${n.status.name() == 'FAILED'} ? danger : '')" th:text="${@labels.t(n.status)}"></span></td>
                    <td><form th:if="${n.status.name() == 'FAILED' or n.status.name() == 'LOGGED'}" th:action="@{/notifications/{id}/retry(id=${n.id})}" method="post">
                        <button class="btn btn-ghost btn-sm" th:title="#{notif.retry}" th:attr="aria-label=#{notif.retry}"><i class="bi bi-arrow-repeat"></i></button></form></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${page.empty}" class="panel-empty" th:text="#{common.none}"></div>
    </div>
    <nav th:replace="~{fragments :: pager(${page}, '/notifications/log')}"></nav>
</section>
</body>
</html>
