<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<span th:fragment="status(s)" class="pill" th:classappend="${'st-' + s.name()}" th:text="${@labels.t(s)}">status</span>

<span th:fragment="priority(p)" class="pr" th:classappend="${'pr-' + p.name()}" th:text="${@labels.t(p)}">priority</span>

<!-- Office tag: colour dot + short code; full name only in the tooltip -->
<span th:fragment="office(o)" class="office-tag o-tag" th:title="${o.name}"><span class="dot o-dot" th:style="'background:' + ${o.color}"></span><span class="ltr" th:text="${o.code ?: o.name}"></span></span>

<span th:fragment="flags(r)" class="d-inline-flex flex-wrap gap-1 align-items-center">
    <!-- One VIP marker only: request priority VIP or VIP visitor -->
    <span th:if="${r.priority.name() == 'VIP' or r.visitor.vip}" class="tag danger" th:title="#{common.vip}" th:attr="aria-label=#{common.vip}"><i class="bi bi-star-fill"></i> <span th:text="#{common.vip}">VIP</span></span>
    <th:block th:if="${r.priority.name() != 'NORMAL' and r.priority.name() != 'VIP'}"><span th:replace="~{fragments :: priority(${r.priority})}"></span></th:block>
    <span th:if="${r.watchlistFlag}" class="tag danger" th:title="#{watch.flagged}"><i class="bi bi-shield-exclamation"></i></span>
    <span th:if="${r.isOverdue(r.office.overdueDays)}" class="tag danger"><i class="bi bi-alarm"></i> <span th:text="#{wait.overdue}"></span></span>
    <span th:if="${r.recommendation != null}" class="tag info"><i class="bi bi-hand-thumbs-up"></i> <span th:text="${@labels.t(r.recommendation)}"></span></span>
    <span th:if="${r.expectedAttendees > 1 or !#lists.isEmpty(r.members)}" class="tag"><i class="bi bi-people"></i> <span th:text="${'' + r.expectedAttendees}"></span></span>
</span>

<nav th:fragment="pager(page, baseUrl)" th:if="${page.totalPages > 1}" class="mt-3">
    <ul class="pagination pagination-sm justify-content-center flex-wrap">
        <li class="page-item" th:classappend="${page.first} ? disabled">
            <a class="page-link" th:href="${baseUrl + (#strings.contains(baseUrl,'?') ? '&' : '?') + 'page=' + (page.number - 1)}" th:attr="aria-label=#{common.previous}"><i class="bi bi-chevron-left flip-rtl d-inline-block"></i></a></li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:if="${i >= page.number - 4 and i <= page.number + 4}" th:classappend="${i == page.number} ? active">
            <a class="page-link" th:href="${baseUrl + (#strings.contains(baseUrl,'?') ? '&' : '?') + 'page=' + i}" th:text="${'' + (i + 1)}">1</a></li>
        <li class="page-item" th:classappend="${page.last} ? disabled">
            <a class="page-link" th:href="${baseUrl + (#strings.contains(baseUrl,'?') ? '&' : '?') + 'page=' + (page.number + 1)}" th:attr="aria-label=#{common.next}"><i class="bi bi-chevron-right flip-rtl d-inline-block"></i></a></li>
    </ul>
</nav>

<!-- Audit trail as a vertical timeline -->
<ul th:fragment="trail(events)" class="timeline">
    <li th:each="a : ${events}" class="timeline-item">
        <span class="timeline-dot" th:classappend="${a.toStatus != null} ? ${'d-' + a.toStatus.name()} : ''"></span>
        <div class="timeline-title" th:text="${#messages.msgOrNull('audit.' + a.action) ?: a.action}">action</div>
        <div class="timeline-detail" th:if="${a.details}" th:text="${@labels.details(a.details)}"></div>
        <div class="timeline-meta"><span th:text="${a.actorName}"></span> · <span class="ltr" th:text="${@dates.dt(a.timestamp)}"></span></div>
    </li>
    <li th:if="${#lists.isEmpty(events)}" class="small-muted" th:text="#{common.none}"></li>
</ul>

</body>
</html>
