<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title th:text="${r.visitor.fullName}">Visit</title></head>
<body>
<section>
    <div class="crumb"><a th:href="@{/reception}" th:text="#{nav.reception}"></a></div>
    <div th:if="${blocked}" class="alert alert-danger fs-5"><i class="bi bi-sign-stop"></i> <b th:text="#{watch.blockedTitle}"></b>
        <ul class="mb-0 fs-6"><li th:each="w : ${hits}" th:text="${w.fullName + ': ' + w.reason}"></li></ul></div>
    <div th:if="${!blocked and !#lists.isEmpty(hits)}" class="alert alert-warning"><i class="bi bi-shield-exclamation"></i> <b th:text="#{watch.hitTitle}"></b>
        <ul class="mb-0"><li th:each="w : ${hits}" th:text="${w.fullName + ': ' + w.reason}"></li></ul></div>
    <div th:if="${!isToday and r.scheduledStart != null}" class="alert alert-warning"><i class="bi bi-calendar-x"></i> <span th:text="#{rec.notToday}"></span> <b class="ltr" th:text="${@dates.dt(r.scheduledStart)}"></b></div>

    <div class="panel" style="max-width:900px">
        <div class="panel-body">
            <div class="d-flex flex-wrap gap-4">
                <img th:if="${r.visitor.photoPath}" th:src="@{/visitors/{id}/photo(id=${r.visitor.id})}" class="person-photo" style="width:140px;height:140px" alt="">
                <span th:unless="${r.visitor.photoPath}" class="person-photo" style="width:140px;height:140px;font-size:3rem"><i class="bi bi-person"></i></span>
                <div class="flex-grow-1">
                    <div class="d-flex gap-2 align-items-center flex-wrap mb-1"><span th:replace="~{fragments :: status(${r.status})}"></span>
                        <span th:replace="~{fragments :: office(${r.office})}"></span><span class="tag ltr" th:text="${r.referenceNumber}"></span></div>
                    <h1 class="h3 fw-bold" style="color:var(--ink)" th:text="${r.visitor.fullName}"></h1>
                    <dl class="kv mt-3">
                        <dt th:text="#{visitor.phone}"></dt><dd class="ltr" th:text="${r.visitor.phone}"></dd>
                        <dt th:text="#{visitor.idNumber}"></dt><dd><span th:text="${@labels.t(r.visitor.idType)}"></span> <span class="ltr" th:text="${r.visitor.maskedIdNumber}"></span></dd>
                        <dt th:text="#{visitor.organization}"></dt><dd th:text="${r.visitor.organization ?: '—'}"></dd>
                        <dt th:text="#{req.subject}"></dt><dd th:text="${r.subject}"></dd>
                        <dt th:text="#{req.scheduled}"></dt><dd class="ltr" th:text="${@dates.dt(r.scheduledStart) ?: '—'}"></dd>
                        <dt th:text="#{req.meetingWith}"></dt><dd th:text="${r.meetingWith ?: r.office.hostTitle}"></dd>
                        <dt th:text="#{req.location}"></dt><dd th:text="${r.location ?: '—'}"></dd>
                        <dt th:text="#{req.vehiclePlate}"></dt><dd class="ltr" th:text="${r.vehiclePlate ?: '—'}"></dd>
                        <dt th:text="#{req.accessibility}"></dt><dd th:text="${r.accessibilityNeeds ?: '—'}"></dd>
                    </dl>
                </div>
            </div>
            <div th:if="${!#lists.isEmpty(r.members)}" class="mt-3">
                <h3 class="h6 fw-bold" th:text="#{req.delegation}"></h3>
                <ul class="small mb-0"><li th:each="m : ${r.members}"><span th:text="${m.fullName}"></span> <span class="small-muted" th:text="${m.jobTitle}"></span>
                    <span th:if="${m.watchlistFlag}" class="tag danger"><i class="bi bi-shield-exclamation"></i></span></li></ul>
            </div>
        </div>
        <div class="panel-foot d-flex flex-wrap gap-2 align-items-center">
            <form th:if="${r.status.name() == 'SCHEDULED' or r.status.name() == 'APPROVED'}" th:action="@{/requests/{id}/checkin(id=${r.id})}" method="post" class="d-flex gap-2 align-items-center">
                <input type="hidden" name="back" value="/reception">
                <button class="btn btn-accent btn-lg" th:disabled="${blocked and !@currentUser.is('SECURITY','ADMIN','DIRECTOR')}"><i class="bi bi-box-arrow-in-right"></i> <span th:text="#{action.checkIn}"></span></button>
                <div class="form-check" th:if="${blocked}" sec:authorize="hasAnyRole('SECURITY','ADMIN','DIRECTOR')">
                    <input type="checkbox" class="form-check-input" name="override" value="true" id="ovr"><label class="form-check-label" for="ovr" th:text="#{req.securityOverride}"></label></div>
            </form>
            <a th:if="${r.qrToken}" th:href="@{/requests/{id}/badge(id=${r.id})}" target="_blank" class="btn btn-light btn-lg"><i class="bi bi-printer"></i> <span th:text="#{req.printBadge}"></span></a>
            <a th:href="@{/requests/{id}(id=${r.id})}" class="btn btn-ghost" th:text="#{common.details}"></a>
        </div>
    </div>
</section>
</body>
</html>
